        preferredLanguage:
          type: string
        leadSource:
          type: string
        isExistingClient:
          type: boolean
        objectives:
          type: array
          items:
            type: string
        assignedToId:
          type: number
        refereeId:
          type: number
        notes:
          type: string

    # REFEREES
    Referee:
      type: object
      required: [id, refereeCode, name, isActive, createdAt, referralFeeStudio, referralFee1br, referralFee2br, referralFee3br, referralFee4brPlus, isRecurringEnabled]
      properties:
        id:
          type: number
        refereeCode:
          type: string
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        referralFeeStudio:
          type: number
          description: One-time referral fee for a studio apartment (AED)
        referralFee1br:
          type: number
          description: One-time referral fee for a 1-bedroom apartment (AED)
        referralFee2br:
          type: number
          description: One-time referral fee for a 2-bedroom apartment (AED)
        referralFee3br:
          type: number
          description: One-time referral fee for a 3-bedroom apartment (AED)
        referralFee4brPlus:
          type: number
          description: One-time referral fee for 4+ bedroom apartments (AED)
        isRecurringEnabled:
          type: boolean
          description: Whether this referee is enrolled in the recurring commission programme. Agent earns max(0, PM% - 16%) recurring; company always retains minimum 15%.
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean
        referredCount:
          type: number
        totalCommissionOwed:
          type: number
          description: Total recurring commission owed to this referee across all referred owners' forecasts (AED)
        createdAt:
          type: string
          format: date-time

    RefereeCommission:
      type: object
      required: [refereeId, refereeName, refereeCode, isRecurringEnabled, totalGrossRevenue, totalCommissionOwed, totalPaid, outstandingBalance, ownerBreakdowns]
      properties:
        refereeId:
          type: number
        refereeName:
          type: string
        refereeCode:
          type: string
        isRecurringEnabled:
          type: boolean
        totalGrossRevenue:
          type: number
          description: Sum of grossAnnualRevenue across all referred owners' latest forecasts (AED)
        totalCommissionOwed:
          type: number
          description: Total recurring commission owed to this referee (AED)
        totalPaid:
          type: number
          description: Total amount already paid to this referee (AED)
        outstandingBalance:
          type: number
          description: Remaining unpaid balance (totalCommissionOwed - totalPaid, AED)
        ownerBreakdowns:
          type: array
          items:
            type: object
            required: [ownerId, ownerName, ownerEmail, grossAnnualRevenue, netOwnerIncome, managementFeePercent, commissionPercent, commissionAmount]
            properties:
              ownerId:
                type: number
              ownerName:
                type: string
              ownerEmail:
                type: string
              forecastId:
                type: ["number", "null"]
              forecastStatus:
                type: ["string", "null"]
              grossAnnualRevenue:
                type: number
              netOwnerIncome:
                type: number
              managementFeePercent:
                type: number
              commissionPercent:
                type: number
                description: Effective commission percentage for this owner (max(0, PM% - 16))
              commissionAmount:
                type: number
                description: Commission amount owed for this owner's forecast (AED)

    RefereeCommissionPayment:
      type: object
      required: [id, refereeId, amountPaid, paidAt, createdAt]
      properties:
        id:
          type: number
        refereeId:
          type: number
        amountPaid:
          type: number
          description: Amount paid in AED
        paidAt:
          type: string
          format: date-time
        notes:
          type: ["string", "null"]
        createdById:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    RefereeCommissionPaymentInput:
      type: object
      required: [amountPaid, paidAt]
      properties:
