openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: RHH Property Revenue Forecaster API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: roles
  - name: users
  - name: owners
  - name: referees
  - name: properties
  - name: market
  - name: forecasts
  - name: proposals
  - name: dashboard
  - name: settings
  - name: imports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # USERS
  # ROLES
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all roles
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /roles/{id}:
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Update a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a custom role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Deactivate a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # OWNERS
  /owners:
    get:
      operationId: listOwners
      tags: [owners]
      summary: List all owners
      responses:
        "200":
          description: List of owners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Owner"
    post:
      operationId: createOwner
      tags: [owners]
      summary: Create a new owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerInput"
      responses:
        "201":
          description: Created owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"

  /owners/{id}:
    get:
      operationId: getOwner
      tags: [owners]
      summary: Get owner by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
    patch:
      operationId: updateOwner
      tags: [owners]
      summary: Update an owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerUpdate"
      responses:
        "200":
          description: Updated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
    delete:
      operationId: deleteOwner
      tags: [owners]
      summary: Archive an owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # REFEREES
  /referees:
    get:
      operationId: listReferees
      tags: [referees]
      summary: List all referees
      responses:
        "200":
          description: List of referees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Referee"
    post:
      operationId: createReferee
      tags: [referees]
      summary: Create a new referee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefereeInput"
      responses:
        "201":
          description: Created referee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referee"

  /referees/{id}:
    get:
      operationId: getReferee
      tags: [referees]
      summary: Get referee by ID with referred owners
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Referee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefereeDetail"
    patch:
      operationId: updateReferee
      tags: [referees]
      summary: Update a referee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefereeUpdate"
      responses:
        "200":
          description: Updated referee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referee"
    delete:
      operationId: deleteReferee
      tags: [referees]
      summary: Deactivate a referee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /referees/{id}/commission:
    get:
      operationId: getRefereeCommission
      tags: [referees]
      summary: Get commission summary for a referee across all referred owners' forecasts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Commission summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefereeCommission"

  /referees/{id}/commission/payments:
    get:
      operationId: listRefereeCommissionPayments
      tags: [referees]
      summary: List all recorded commission payments for a referee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RefereeCommissionPayment"
    post:
      operationId: recordRefereeCommissionPayment
      tags: [referees]
      summary: Record a commission payment for a referee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefereeCommissionPaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefereeCommissionPayment"

  # PROPERTIES
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all properties
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get property by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  # MARKET AREAS
  /market/areas:
    get:
      operationId: listMarketAreas
      tags: [market]
      summary: List market areas
      responses:
        "200":
          description: Market areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketArea"
    post:
      operationId: createMarketArea
      tags: [market]
      summary: Create a market area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketAreaInput"
      responses:
        "201":
          description: Created market area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketArea"

  /market/areas/{id}:
    patch:
      operationId: updateMarketArea
      tags: [market]
      summary: Update a market area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketAreaUpdate"
      responses:
        "200":
          description: Updated market area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketArea"
    delete:
      operationId: deleteMarketArea
      tags: [market]
      summary: Delete market area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # UNIT TYPE BENCHMARKS
  /market/benchmarks:
    get:
      operationId: listBenchmarks
      tags: [market]
      summary: List unit type benchmarks
      responses:
        "200":
          description: Benchmarks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnitBenchmark"
    post:
      operationId: createBenchmark
      tags: [market]
      summary: Create a benchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitBenchmarkInput"
      responses:
        "201":
          description: Created benchmark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitBenchmark"

  /market/benchmarks/{id}:
    patch:
      operationId: updateBenchmark
      tags: [market]
      summary: Update a benchmark
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitBenchmarkUpdate"
      responses:
        "200":
          description: Updated benchmark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitBenchmark"
    delete:
      operationId: deleteBenchmark
      tags: [market]
      summary: Delete benchmark
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # FORECASTS
  /forecasts:
    get:
      operationId: listForecasts
      tags: [forecasts]
      summary: List all forecasts
      responses:
        "200":
          description: List of forecasts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Forecast"
    post:
      operationId: createForecast
      tags: [forecasts]
      summary: Create a new forecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastInput"
      responses:
        "201":
          description: Created forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forecast"

  /forecasts/{id}:
    get:
      operationId: getForecast
      tags: [forecasts]
      summary: Get a forecast with full detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Forecast detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastDetail"
    patch:
      operationId: updateForecast
      tags: [forecasts]
      summary: Update a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastUpdate"
      responses:
        "200":
          description: Updated forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastDetail"
    delete:
      operationId: deleteForecast
      tags: [forecasts]
      summary: Archive a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /forecasts/{id}/calculate:
    post:
      operationId: calculateForecast
      tags: [forecasts]
      summary: Recalculate all financial projections for a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResult"

  /forecasts/{id}/approve:
    post:
      operationId: approveForecast
      tags: [forecasts]
      summary: Approve a forecast for publishing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forecast"

  /forecasts/{id}/duplicate:
    post:
      operationId: duplicateForecast
      tags: [forecasts]
      summary: Duplicate a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "201":
          description: Duplicated forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forecast"

  /forecasts/{id}/scenarios:
    get:
      operationId: listForecastScenarios
      tags: [forecasts]
      summary: List occupancy scenarios for a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
    post:
      operationId: createScenario
      tags: [forecasts]
      summary: Create a scenario for a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioInput"
      responses:
        "201":
          description: Created scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"

  /forecasts/{id}/monthly:
    get:
      operationId: getForecastMonthly
      tags: [forecasts]
      summary: Get monthly projections for a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Monthly projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyProjection"

  /forecasts/{id}/monthly/{monthNum}:
    patch:
      operationId: updateMonthlyOverride
      tags: [forecasts]
      summary: Save per-month occupancy/ADR override and recalculate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: monthNum
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyOverrideInput"
      responses:
        "200":
          description: Updated monthly projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyProjection"

  /forecasts/{id}/comparables:
    get:
      operationId: listForecastComparables
      tags: [forecasts]
      summary: List comparable properties for a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Comparables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForecastComparable"
    post:
      operationId: createForecastComparable
      tags: [forecasts]
      summary: Add a comparable property to a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastComparableInput"
      responses:
        "201":
          description: Created comparable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastComparable"

  /forecasts/{id}/comparables/{compId}:
    delete:
      operationId: deleteForecastComparable
      tags: [forecasts]
      summary: Delete a comparable property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: compId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /forecasts/{id}/actuals:
    get:
      operationId: listForecastActuals
      tags: [forecasts]
      summary: Get monthly actuals for a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Monthly actuals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyActual"

  /forecasts/{id}/actuals/{monthNum}:
    put:
      operationId: upsertMonthlyActual
      tags: [forecasts]
      summary: Upsert actual revenue for a specific month (1–12)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: monthNum
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyActualInput"
      responses:
        "200":
          description: Upserted monthly actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyActual"

  /forecasts/{id}/ai-recommend:
    post:
      operationId: generateAiRecommendation
      tags: [forecasts]
      summary: Generate AI pricing recommendations for a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: AI recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRecommendation"

  /forecasts/{id}/narrative-draft:
    post:
      operationId: generateNarrativeDraft
      tags: [forecasts]
      summary: Generate an AI-drafted cover narrative for a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Generated draft narrative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NarrativeDraftResponse"

  /forecasts/{id}/ai-recommend/accept:
    post:
      operationId: acceptAiRecommendation
      tags: [forecasts]
      summary: Accept or override AI recommendation fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAcceptInput"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # PROPOSALS
  /proposals:
    get:
      operationId: listProposals
      tags: [proposals]
      summary: List all proposals
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"

  /proposals/{id}:
    get:
      operationId: getProposal
      tags: [proposals]
      summary: Get a proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
    patch:
      operationId: updateProposal
      tags: [proposals]
      summary: Update proposal content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalUpdate"
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"

  /proposals/{id}/publish:
    post:
      operationId: publishProposal
      tags: [proposals]
      summary: Publish a proposal and generate shareable link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishInput"
      responses:
        "200":
          description: Published with share link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"

  /proposals/{id}/activity:
    get:
      operationId: getProposalActivity
      tags: [proposals]
      summary: Get engagement activity for a proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /proposals/{id}/revoke:
    post:
      operationId: revokeProposalLink
      tags: [proposals]
      summary: Revoke shareable link for a proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # PUBLIC PROPOSAL VIEW (owner-facing, token-based)
  /p/{token}:
    get:
      operationId: getPublicProposal
      tags: [proposals]
      summary: Get public proposal by share token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public proposal view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProposal"
        "404":
          description: Not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /p/{token}/action:
    post:
      operationId: submitProposalAction
      tags: [proposals]
      summary: Submit an owner action (accept, decline, request call, ask question)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalActionInput"
      responses:
        "200":
          description: Action submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # DASHBOARD
  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Get dashboard KPI summary
      responses:
        "200":
          description: KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"

  /dashboard/recent:
    get:
      operationId: getRecentForecasts
      tags: [dashboard]
      summary: Get recently updated forecasts
      responses:
        "200":
          description: Recent forecasts
          content:
            application/json:
              schema:
