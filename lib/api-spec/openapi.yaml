components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    NarrativeDraftResponse:
      type: object
      properties:
        draft:
          type: string
      required: [draft]

    # AUTH
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [super_admin, admin, sales, revenue_manager, read_only]
        avatarUrl:
          type: ["string", "null"]

    # ROLES
    Role:
      type: object
      required: [id, name, label, permissions, color, isBuiltIn, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        label:
          type: string
        description:
          type: ["string", "null"]
        permissions:
          type: array
          items:
            type: string
        color:
          type: string
        isBuiltIn:
          type: boolean
        createdAt:
          type: string
          format: date-time

    RoleInput:
      type: object
      required: [name, label, permissions]
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        color:
          type: string

    RoleUpdate:
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        color:
          type: string

    # USERS
    User:
      type: object
      required: [id, email, name, role, isActive, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        role:
          type: string
        roleLabel:
          type: ["string", "null"]
        roleId:
          type: ["number", "null"]
        isActive:
          type: boolean
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: ["string", "null"]

    UserInput:
      type: object
      required: [email, name, roleId, password]
      properties:
        email:
          type: string
        name:
          type: string
        roleId:
          type: number
        password:
          type: string
        phone:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        roleId:
          type: number
        isActive:
          type: boolean
        phone:
          type: string

    # OWNERS
    Owner:
      type: object
      required: [id, ownerType, firstName, lastName, email, createdAt]
      properties:
        id:
          type: number
        ownerType:
          type: string
          enum: [individual, company]
        title:
          type: ["string", "null"]
        firstName:
          type: string
        lastName:
          type: string
        companyName:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        whatsapp:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        preferredLanguage:
          type: ["string", "null"]
        leadSource:
          type: ["string", "null"]
        isExistingClient:
          type: boolean
        objectives:
          type: array
          items:
            type: string
        assignedToId:
          type: ["number", "null"]
        assignedToName:
          type: ["string", "null"]
        refereeId:
          type: ["number", "null"]
        refereeName:
          type: ["string", "null"]
        refereeCode:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    OwnerInput:
      type: object
      required: [ownerType, firstName, lastName, email]
      properties:
        ownerType:
          type: string
          enum: [individual, company]
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        companyName:
          type: string
        email:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        nationality:
          type: string
        preferredLanguage:
          type: string
        leadSource:
          type: string
        isExistingClient:
          type: boolean
        objectives:
          type: array
          items:
            type: string
        assignedToId:
          type: number
        refereeId:
          type: number
        notes:
          type: string

    OwnerUpdate:
      type: object
      properties:
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        companyName:
          type: string
        email:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        nationality:
