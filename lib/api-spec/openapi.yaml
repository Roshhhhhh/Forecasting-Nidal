    patch:
      operationId: updateCompanySettings
      tags: [settings]
      summary: Update company settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"

  # IMPORTS
  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List file imports
      responses:
        "200":
          description: Imports
          content:
            application/json:
              schema:
